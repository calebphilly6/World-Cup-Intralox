<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clickable cards</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      body {
        margin: 0;
        background: transparent;
      }
      img[src*="flagcdn.com"] {
        background: #ffffff;
        box-sizing: border-box;
        display: block;
        object-fit: cover;
        object-position: center;
      }
      .grid {
        display: grid;
        gap: 12px;
      }
      .group-banner {
        display: grid;
        grid-template-columns: 180px minmax(0, 1fr);
        gap: 18px;
        align-items: center;
        padding: 18px;
        border: 1px solid rgba(214, 168, 58, 0.34);
        border-radius: 10px;
        background:
          linear-gradient(135deg, rgba(5, 5, 5, 0.58), rgba(11, 16, 32, 0.54)),
          radial-gradient(circle at 100% 0%, rgba(214, 168, 58, 0.18), transparent 34%);
      }
      .group-copy {
        min-width: 0;
      }
      .group-kicker {
        color: rgba(248, 250, 252, 0.7);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .group-title {
        margin-top: 4px;
        color: #d6a83a;
        font-size: 2.25rem;
        line-height: 1;
        font-weight: 900;
      }
      .grid.groups {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .grid.rankings {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .grid.ranking-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.55rem;
      }
      button {
        width: 100%;
        border: 1px solid rgba(214, 168, 58, 0.28);
        border-radius: 8px;
        background: rgba(5, 5, 5, 0.38);
        color: #f8fafc;
        cursor: pointer;
        font: inherit;
        text-align: left;
        transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
      }
      button:hover,
      button:focus-visible {
        transform: translateY(-1px);
        border-color: rgba(214, 168, 58, 0.82);
        background: rgba(214, 168, 58, 0.16);
        outline: none;
      }
      .group-card {
        min-height: 104px;
        padding: 12px;
        display: grid;
        justify-items: center;
        align-content: center;
        gap: 9px;
      }
      .group-card img {
        width: 62px;
        aspect-ratio: 3 / 2;
        object-fit: cover;
        border-radius: 4px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.36);
      }
      .group-card strong {
        font-size: 0.95rem;
        text-align: center;
      }
      .ranking-card {
        min-height: 108px;
        padding: 12px;
        display: grid;
        grid-template-columns: 48px 52px minmax(0, 1fr);
        gap: 10px;
        align-items: center;
      }
      .ranking-row-button {
        align-items: center;
        border: 1px solid rgba(214,168,58,.22);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(5,5,5,.58), rgba(11,16,32,.54)),
          radial-gradient(circle at 100% 0%, rgba(214,168,58,.14), transparent 34%);
        box-shadow: 0 12px 30px rgba(0,0,0,.16);
        display: grid;
        grid-template-columns: 58px 58px 1fr;
        gap: 0.85rem;
        min-height: 76px;
        padding: 0.58rem;
        transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
      }
      .ranking-row-button:hover,
      .ranking-row-button:focus-visible {
        background:
          linear-gradient(135deg, rgba(5,5,5,.58), rgba(11,16,32,.54)),
          radial-gradient(circle at 100% 0%, rgba(214,168,58,.14), transparent 34%);
        border-color: rgba(214,168,58,.68);
        box-shadow: 0 16px 38px rgba(0,0,0,.24);
      }
      .ranking-position {
        color: #D6A83A;
        font-size: 1.55rem;
        font-weight: 950;
        text-align: center;
      }
      .ranking-row-button .ranking-position {
        font-size: 1.55rem;
      }
      .ranking-flag img,
      .ranking-flag .flag-fallback,
      .ranking-flag-fallback {
        aspect-ratio: 3 / 2;
        border: 1px solid rgba(255,255,255,.52);
        border-radius: 6px;
        box-shadow: 0 8px 18px rgba(0,0,0,.34);
        display: block;
        object-fit: cover;
        object-position: center;
        width: 100%;
      }
      .ranking-flag .flag-fallback {
        width: 100%;
      }
      .ranking-flag-fallback {
        align-items: center;
        background: linear-gradient(135deg, rgba(214,168,58,.35), rgba(36,88,255,.22));
        color: #FFFFFF;
        display: grid;
        font-weight: 950;
        justify-content: center;
      }
      .ranking-flag-fallback.hidden {
        display: none;
      }
      .ranking-name {
        color: #FFFFFF;
        font-size: 1.08rem;
        font-weight: 950;
        line-height: 1.05;
      }
      .ranking-meta {
        align-items: center;
        color: #CBD5E1;
        display: flex;
        flex-wrap: wrap;
        gap: .35rem .55rem;
        font-size: .76rem;
        font-weight: 800;
        margin-top: .4rem;
        text-transform: uppercase;
      }
      .ranking-badge {
        border: 1px solid rgba(214,168,58,.42);
        border-radius: 999px;
        color: #D6A83A;
        padding: .1rem .45rem;
      }
      .rank {
        color: #d6a83a;
        font-size: 1.15rem;
        font-weight: 800;
      }
      .ranking-card img,
      .flag-fallback {
        width: 46px;
        aspect-ratio: 3 / 2;
        object-fit: cover;
        border-radius: 4px;
      }
      .flag-fallback {
        display: grid;
        place-items: center;
        background: rgba(214, 168, 58, 0.18);
        border: 1px solid rgba(214, 168, 58, 0.36);
        font-weight: 800;
      }
      .name {
        font-weight: 800;
        overflow-wrap: anywhere;
      }
      .meta {
        margin-top: 4px;
        color: rgba(248, 250, 252, 0.72);
        font-size: 0.78rem;
      }
      @media (max-width: 720px) {
        .grid.groups,
        .grid.rankings {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .grid.ranking-list {
          grid-template-columns: 1fr;
        }
        .group-banner {
          grid-template-columns: 1fr;
        }
        .group-title {
          font-size: 1.8rem;
        }
        .ranking-card {
          grid-template-columns: 42px minmax(0, 1fr);
        }
        .ranking-card .rank {
          grid-row: span 2;
        }
        .ranking-row-button {
          grid-template-columns: 52px 54px 1fr;
        }
        .ranking-row-button .ranking-position {
          font-size: 1.2rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const READY = "streamlit:componentReady";
      const RENDER = "streamlit:render";
      const SET_VALUE = "streamlit:setComponentValue";
      const SET_HEIGHT = "streamlit:setFrameHeight";

      function send(type, data) {
        window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function initials(name) {
        return String(name || "?")
          .split(/\s+/)
          .slice(0, 2)
          .map((part) => part[0] || "")
          .join("")
          .toUpperCase() || "?";
      }

      function flagMarkup(card) {
        if (card.flag_url) {
          return `<img src="${escapeHtml(card.flag_url)}" alt="${escapeHtml(card.name)} flag" onerror="this.replaceWith(fallbackFlag('${escapeHtml(initials(card.name))}'));">`;
        }
        return `<span class="flag-fallback">${escapeHtml(initials(card.name))}</span>`;
      }

      function fallbackFlag(text) {
        const span = document.createElement("span");
        span.className = "flag-fallback";
        span.textContent = text;
        return span;
      }

      function renderGroupCard(card) {
        return `
          <button class="group-card" data-id="${escapeHtml(card.id)}" type="button" aria-label="Open ${escapeHtml(card.name)}">
            ${flagMarkup(card)}
            <strong>${escapeHtml(card.name)}</strong>
          </button>
        `;
      }

      function renderRankingCard(card) {
        const meta = card.group ? `Group ${escapeHtml(card.group)}` : "World Cup";
        return `
          <button class="ranking-card" data-id="${escapeHtml(card.id)}" type="button" aria-label="Open ${escapeHtml(card.name)}">
            <div class="rank">#${escapeHtml(card.rank || "TBD")}</div>
            ${flagMarkup(card)}
            <div>
              <div class="name">${escapeHtml(card.name)}</div>
              <div class="meta">${meta}</div>
            </div>
          </button>
        `;
      }

      function renderRankingRow(card) {
        const badge = card.badge ? `<span class="ranking-badge">${escapeHtml(card.badge)}</span>` : "";
        return `
          <button class="ranking-row-button" data-id="${escapeHtml(card.id)}" type="button" aria-label="Open ${escapeHtml(card.name)}">
            <div class="ranking-position">#${escapeHtml(card.rank || "TBD")}</div>
            <div class="ranking-flag">${flagMarkup(card)}</div>
            <div class="ranking-main">
              <div class="ranking-name">${escapeHtml(card.name)}</div>
              <div class="ranking-meta">${badge}</div>
            </div>
          </button>
        `;
      }

      function handleRender(event) {
        if (!event.data || event.data.type !== RENDER) return;
        const args = event.data.args || {};
        const cards = Array.isArray(args.cards) ? args.cards : [];
        const variant = ["groups", "ranking-list"].includes(args.variant) ? args.variant : "rankings";
        const title = args.title || "";
        const renderer = variant === "groups" ? renderGroupCard : variant === "ranking-list" ? renderRankingRow : renderRankingCard;
        const root = document.getElementById("root");
        const grid = `<div class="grid ${variant}">${cards.map(renderer).join("")}</div>`;
        root.innerHTML = variant === "groups"
          ? `<section class="group-banner"><div class="group-copy"><div class="group-kicker">Group</div><div class="group-title">${escapeHtml(title)}</div></div>${grid}</section>`
          : grid;
        root.querySelectorAll("button[data-id]").forEach((button) => {
          button.addEventListener("click", () => {
            send(SET_VALUE, { value: button.dataset.id, dataType: "json" });
          });
        });
        requestAnimationFrame(() => send(SET_HEIGHT, { height: document.body.scrollHeight }));
      }

      window.addEventListener("message", handleRender);
      send(READY, { apiVersion: 1 });
      send(SET_HEIGHT, { height: 0 });
    </script>
  </body>
</html>
