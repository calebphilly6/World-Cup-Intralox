<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>History navigation</title>
  </head>
  <body>
    <script>
      const READY = "streamlit:componentReady";
      const RENDER = "streamlit:render";
      const SET_VALUE = "streamlit:setComponentValue";
      const SET_HEIGHT = "streamlit:setFrameHeight";

      // These variables live for the lifetime of the iframe. Streamlit keeps a
      // single iframe per component instance and only posts new RENDER messages
      // on rerun, so this state persists across Streamlit reruns.
      let committedToken = null;
      // A token we arrived at via the browser Back/Forward button. The next
      // RENDER carrying it must NOT push a new history entry (the browser
      // already moved us there) and should restore that view's scroll position.
      let popTargetToken = null;
      let nonce = 0;
      const scrollPositions = {};
      // After a click that triggers a rerun, Streamlit swaps the page and the
      // browser fires a "clamp" scroll event for the new (often shorter) page.
      // Ignore scroll events briefly after a click so they don't overwrite the
      // position we captured for the view we are leaving.
      let ignoreScrollUntil = 0;

      const parentWindow = window.parent;
      const parentDoc = parentWindow.document;

      function send(type, data) {
        parentWindow.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
      }

      function sendValue(value) {
        send(SET_VALUE, { value, dataType: "json" });
      }

      // Streamlit's main content lives in a scrollable container; fall back to
      // the window if the expected container can't be found.
      function scrollTargets() {
        const targets = [];
        const selectors = [
          '[data-testid="stMain"]',
          '[data-testid="stAppViewContainer"]',
          'section.main',
          '.main',
        ];
        for (const selector of selectors) {
          const element = parentDoc.querySelector(selector);
          if (element) {
            targets.push(element);
          }
        }
        return targets;
      }

      function currentScroll() {
        for (const element of scrollTargets()) {
          if (element.scrollTop > 0) {
            return element.scrollTop;
          }
        }
        return parentWindow.scrollY || parentDoc.documentElement.scrollTop || 0;
      }

      function applyScroll(value) {
        for (const element of scrollTargets()) {
          element.scrollTop = value;
        }
        try {
          parentWindow.scrollTo(0, value);
        } catch (error) {
          /* ignore */
        }
      }

      // Streamlit streams content in after the RENDER message, so the target
      // height may not exist yet. Re-apply the scroll a few times to win the race.
      function scrollToTopSoon() {
        applyScroll(0);
        [30, 90, 180, 320].forEach((delay) => parentWindow.setTimeout(() => applyScroll(0), delay));
      }

      // Restoring scroll fights Streamlit streaming content in: until the page
      // grows back to its previous height the browser clamps scrollTop to a
      // smaller value. Keep re-applying until it sticks (or we time out).
      function restoreScrollSoon(token) {
        const target = scrollPositions[token] || 0;
        if (!target) {
          applyScroll(0);
          return;
        }
        // Long pages (e.g. the full fixtures list, ~35k px) rebuild gradually on a
        // rerun, so a fixed timeout isn't enough. Keep re-applying while the page
        // is still growing; stop once we've reached the target, the page has
        // finished growing (target unreachable), or we hit a hard cap.
        const hardCap = Date.now() + 10000;
        let lastHeight = -1;
        let stableSince = Date.now();
        const tick = () => {
          applyScroll(target);
          if (currentScroll() >= target - 2 || Date.now() > hardCap) {
            return;
          }
          const container = parentDoc.querySelector('[data-testid="stMain"]');
          const height = container ? container.scrollHeight : 0;
          if (height !== lastHeight) {
            lastHeight = height;
            stableSince = Date.now();
          } else if (Date.now() - stableSince > 800) {
            return;
          }
          parentWindow.requestAnimationFrame(tick);
        };
        tick();
      }

      // Write our marker into history.state (merging so nothing else is lost). If
      // a url is given, update the address bar too — but only via the History API,
      // never st.query_params, so Streamlit never pushes a competing entry.
      function tagState(token, url) {
        try {
          const state = { ...(parentWindow.history.state || {}), wcToken: token };
          if (url) {
            parentWindow.history.replaceState(state, "", url);
          } else {
            parentWindow.history.replaceState(state, "");
          }
        } catch (error) {
          /* ignore */
        }
      }

      function pushState(token, url) {
        try {
          const state = { ...(parentWindow.history.state || {}), wcToken: token };
          if (url) {
            parentWindow.history.pushState(state, "", url);
          } else {
            parentWindow.history.pushState(state, "");
          }
        } catch (error) {
          /* ignore */
        }
      }

      function handleRender(event) {
        if (!event.data || event.data.type !== RENDER) {
          return;
        }
        const args = event.data.args || {};
        const token = String(args.token == null ? "" : args.token);
        const url = args.url ? String(args.url) : "";

        if (committedToken === null) {
          // First render of the session: tag the current entry and sync the URL.
          committedToken = token;
          tagState(token, url);
          return;
        }

        if (token === committedToken) {
          // A plain rerun that did not change the view. Keep the URL/marker synced.
          tagState(token, url);
          return;
        }

        if (token === popTargetToken) {
          // The user pressed Back/Forward; the browser already restored this entry
          // (and its URL). Re-assert the marker and restore the saved scroll.
          committedToken = token;
          popTargetToken = null;
          tagState(token, url);
          restoreScrollSoon(token);
          return;
        }

        // A normal in-app navigation. Streamlit no longer touches the URL or
        // history (navigation writes session state only), so we are the sole
        // owner: re-assert the marker on the entry we are leaving (keeping its own
        // URL), then push a new entry with the new view's URL. The leaving view's
        // scroll was captured at pointerdown, before the page swapped.
        tagState(committedToken);
        pushState(token, url);
        committedToken = token;
        scrollToTopSoon();
      }

      parentWindow.addEventListener("popstate", (event) => {
        const target = event.state && event.state.wcToken;
        if (!target || target === committedToken) {
          return;
        }
        // The page has not swapped yet, so this reads the correct position for
        // the view we are leaving. Ignore the clamp scroll event that follows.
        scrollPositions[committedToken] = currentScroll();
        ignoreScrollUntil = Date.now() + 700;
        popTargetToken = target;
        nonce += 1;
        sendValue({ kind: "pop", token: target, nonce });
      });

      // Capture the scroll position of the current view at the instant of a
      // click, before it can trigger a rerun that swaps the page.
      parentDoc.addEventListener(
        "pointerdown",
        () => {
          scrollPositions[committedToken] = currentScroll();
          ignoreScrollUntil = Date.now() + 700;
        },
        true
      );

      // Delegate clicks on any element marked data-wc-team (team names/flags in
      // fixtures, odds, Intralox, etc.) to open that team's profile. This adds no
      // visible markup of its own — pages just tag the existing elements.
      parentDoc.addEventListener(
        "click",
        (event) => {
          const target = event.target;
          if (!target || typeof target.closest !== "function") {
            return;
          }
          const link = target.closest("[data-wc-team]");
          if (link) {
            const team = link.getAttribute("data-wc-team");
            if (team) {
              nonce += 1;
              sendValue({ kind: "team", team, nonce });
            }
            return;
          }
          // The bracket lives in its own iframe, so on a card click it tags a
          // hidden trigger in this document with the match number and clicks it;
          // we relay that to Python to open the fixture card.
          const fixtureEl = target.closest("[data-wc-fixture]");
          if (fixtureEl) {
            const match = fixtureEl.getAttribute("data-wc-fixture");
            if (match) {
              nonce += 1;
              sendValue({ kind: "fixture", match, nonce });
            }
          }
        },
        true
      );

      // Keep the current view's saved scroll fresh as the user scrolls (so a
      // later Back can restore it), skipping the post-click clamp events.
      let scrollFrame = 0;
      parentWindow.addEventListener(
        "scroll",
        () => {
          if (Date.now() < ignoreScrollUntil || scrollFrame) {
            return;
          }
          scrollFrame = parentWindow.requestAnimationFrame(() => {
            scrollFrame = 0;
            if (Date.now() < ignoreScrollUntil) {
              return;
            }
            scrollPositions[committedToken] = currentScroll();
          });
        },
        true
      );

      window.addEventListener("message", handleRender);
      send(READY, { apiVersion: 1 });
      send(SET_HEIGHT, { height: 0 });
    </script>
  </body>
</html>
